server:
  # Only this machine talks to the backend: the Tauri window and nothing else.
  address: 127.0.0.1
  port: ${BANCADA_PORT:8747}
  # The customer panel comes through the gateway (127.0.0.1): X-Forwarded-For/Proto give the
  # visitor address and whether it used HTTPS.
  forward-headers-strategy: native

spring:
  application:
    name: bancada
  datasource:
    # IMMEDIATE: a transaction takes the write lock when it begins and waits for it (busy_timeout);
    # the default DEFERRED fails at once with SQLITE_BUSY_SNAPSHOT when another connection wrote
    # after it started reading, which killed background operations.
    url: "jdbc:sqlite:${BANCADA_DB:${user.home}/.bancada/bancada.db}?journal_mode=WAL&synchronous=NORMAL&transaction_mode=IMMEDIATE"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 6
      connection-init-sql: "PRAGMA busy_timeout=30000"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  mvc:
    async:
      request-timeout: -1

logging:
  file:
    # Launched by the Tauri shell the backend has no console; this file is the only trace.
    name: ${bancada.data-dir}/logs/bancada.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 5

springdoc:
  swagger-ui:
    path: /swagger
    tagsSorter: alpha
    operationsSorter: alpha

bancada:
  # Session token generated by the Tauri shell on every launch. Empty in development:
  # the filter is then disabled and a warning is logged.
  token: ${BANCADA_TOKEN:}
  data-dir: ${BANCADA_DATA:${user.home}/.bancada}
  portal:
    # Local port of the customer panel, published on the internet by the gateway.
    port: ${BANCADA_PORTAL_PORT:8748}
  vms:
    # Hyper-V network of the machines, created by tools\habilitar-hyperv.ps1: an internal switch,
    # this PC at <network>.1 and NAT to the internet. Every machine gets a fixed address in it.
    switch: ${BANCADA_VM_SWITCH:Bancada}
    network: ${BANCADA_VM_NETWORK:10.77.0}
    # memory kept for Windows and the panel; machines only get what is left
    reserved-memory-mb: ${BANCADA_VM_RESERVED_MB:4096}
  nbd:
    # Where the devices fetch the disks kept on this PC (standard NBD port). Only the device a
    # disk was given to is served.
    port: ${BANCADA_NBD_PORT:10809}

parent-pid: 0
