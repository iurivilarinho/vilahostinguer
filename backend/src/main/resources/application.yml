server:
  # Only this machine talks to the backend: the Tauri window and nothing else.
  address: 127.0.0.1
  port: ${BANCADA_PORT:8747}

spring:
  application:
    name: bancada
  datasource:
    url: "jdbc:sqlite:${BANCADA_DB:${user.home}/.bancada/bancada.db}?journal_mode=WAL&synchronous=NORMAL"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 6
      connection-init-sql: "PRAGMA busy_timeout=30000"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  mvc:
    async:
      request-timeout: -1

logging:
  file:
    # Launched by the Tauri shell the backend has no console; this file is the only trace.
    name: ${bancada.data-dir}/logs/bancada.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 5

springdoc:
  swagger-ui:
    path: /swagger
    tagsSorter: alpha
    operationsSorter: alpha

bancada:
  # Session token generated by the Tauri shell on every launch. Empty in development:
  # the filter is then disabled and a warning is logged.
  token: ${BANCADA_TOKEN:}
  data-dir: ${BANCADA_DATA:${user.home}/.bancada}

parent-pid: 0
