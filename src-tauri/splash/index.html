<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Bancada</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f4f5ff;
        color: #2f1c6a;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #673de6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #ebe4ff;
        border-top-color: #673de6;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      p {
        margin: 0;
        color: #6d7081;
        font-size: 14px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #131316;
          color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="16" width="36" height="10" rx="3" fill="#fff" />
        <rect x="14" y="30" width="36" height="10" rx="3" fill="#fff" opacity=".85" />
        <rect x="18" y="44" width="4" height="8" rx="1.5" fill="#fff" />
        <rect x="42" y="44" width="4" height="8" rx="1.5" fill="#fff" />
      </svg>
    </div>
    <div class="spinner"></div>
    <p>Iniciando a Bancada…</p>
  </body>
</html>
